<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내 퀀트 대시보드</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11151d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#0b0e14; --panel:#11151d; --line:#1f2633; --txt:#d7dde8; --dim:#7d879a;
    --up:#16c79a; --dn:#f0476a; --accent:#4c8dff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--txt);font:12px/1.4 -apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
  .num{font-variant-numeric:tabular-nums;font-family:ui-monospace,"SF Mono",Consolas,monospace}
  #app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:auto 1fr;height:100vh}
  header{grid-column:1/3;display:flex;gap:18px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header .sym{display:flex;align-items:center;gap:14px}
  .symPick{position:relative}
  #symBtn{display:flex;align-items:center;gap:10px;background:none;border:0;padding:3px 8px 3px 4px;border-radius:10px;color:var(--txt)}
  #symBtn:hover,#symBtn.open{background:#171c27}
  #symBtn .menu{color:var(--txt);display:flex;opacity:.9}
  .coin{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;overflow:hidden;color:#fff;font-weight:700}
  .coin::before{content:attr(data-l)}
  .coin img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;background:#0d1117}
  .symTxt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
  .symTxt b{font-size:18px;font-weight:800;letter-spacing:.2px}
  .symTxt .sub{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:12px;margin-top:1px}
  .symInfo{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:#f5a623;color:#1a1305;font:italic 800 9px/1 Georgia,serif}
  #symPop{display:none;position:absolute;top:calc(100% + 6px);left:0;width:330px;max-height:460px;z-index:60;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.55);overflow:hidden}
  #symPop.open{display:flex}
  #symQ{margin:10px 10px 6px;padding:8px 10px;background:#0e121a;color:var(--txt);border:1px solid var(--line);border-radius:8px;font:inherit;outline:none}
  #symQ:focus{border-color:var(--accent)}
  #symCnt{padding:0 12px 6px;color:var(--dim);font-size:11px}
  #symList{overflow:auto;padding-bottom:6px}
  .symRow{display:flex;align-items:center;gap:10px;padding:6px 12px;cursor:pointer}
  .symRow:hover,.symRow.act{background:#171c27}
  .symRow b{font-size:13px;min-width:92px}
  .symRow .dim{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  select,button{background:#171c27;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit;cursor:pointer}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .price{font-size:20px;font-weight:700}
  .stat{display:flex;flex-direction:column}
  .stat .k{color:var(--dim);font-size:10px}
  .up{color:var(--up)} .dn{color:var(--dn)} .dim{color:var(--dim)}
  .conn{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:#555;display:inline-block}
  .dot.ok{background:var(--up)} .dot.bad{background:var(--dn)}
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .box{display:flex;flex-direction:column;min-height:0;flex:1;border-bottom:1px solid var(--line)}
  .box h3{font-size:12px;padding:8px 10px 4px;color:var(--dim);font-weight:600;display:flex;justify-content:space-between;align-items:center}
  .list{overflow:hidden;flex:1;padding:0 6px}
  .row{display:grid;grid-template-columns:1fr auto auto;gap:6px;padding:2px 4px;border-radius:3px;font-size:11px}
  .row.buy{background:rgba(22,199,154,.10)} .row.sell{background:rgba(240,71,106,.10)}
  .row.big{font-weight:700}
  .row .t{color:var(--dim);min-width:30px;text-align:right}
  .bar{display:flex;height:5px;margin:4px 10px 8px;border-radius:3px;overflow:hidden;background:var(--dn)}
  .bar i{background:var(--up);display:block;height:100%;width:50%}
  .barlbl{display:flex;justify-content:space-between;padding:0 10px;color:var(--dim);font-size:10px}
  main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .toolbar{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .toolbar .sp{flex:1}
  #chartWrap{position:relative;flex:1;min-height:120px;background:#0b0e14}
  #chart{position:absolute;inset:0;z-index:1}
  #bubbles{position:absolute;inset:0;pointer-events:none;z-index:0}
  #flashLayer{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  #flashLayer i{position:absolute;left:0;right:0;height:50%;opacity:0;will-change:opacity}
  .legend{position:absolute;left:10px;top:6px;z-index:6;color:var(--dim);font-size:11px;pointer-events:none}
  .legend b{color:var(--txt);font-weight:600}
  label.chk{display:flex;gap:4px;align-items:center;color:var(--dim)}

  /* 거래소 선택 바 */
  .exbar{display:flex;flex-wrap:wrap;gap:4px;padding:4px 8px 2px}
  .exbar button{position:relative;display:flex;align-items:center;padding:3px 4px;background:none;border:1px solid var(--line);border-radius:4px;cursor:pointer;opacity:.35}
  .exbar button.on{opacity:1}
  .exbar button .ex{margin:0}
  .exbar button .st{position:absolute;right:-2px;top:-2px;width:6px;height:6px;border-radius:50%;background:#666}
  .exbar button .st.ok{background:#16c79a} .exbar button .st.conn{background:#e8b84a} .exbar button .st.err{background:#f0476a}
  /* 고래 체결 거래소 아이콘 */
  .ex{display:inline-flex;vertical-align:-2px;margin-right:5px;width:13px;height:13px}
  .ex svg,.ex img{width:13px;height:13px;display:block;border-radius:2px}

  /* 하단 바이비트식 포지션 패널 */
  #split{height:6px;cursor:row-resize;background:var(--line);flex:none}
  #split:hover{background:var(--accent)}
  #posPanel{flex:none;height:280px;min-height:90px;display:flex;flex-direction:column;background:var(--panel)}
  .ptabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line);padding:0 8px;flex:none;flex-wrap:wrap}
  .ptab{padding:8px 12px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;font-weight:600;user-select:none;white-space:nowrap}
  .ptab:hover{color:var(--txt)}
  .ptab.on{color:var(--txt);border-bottom-color:var(--accent)}
  .ptab .cnt{color:var(--accent);margin-left:3px}
  .pright{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--dim);font-size:11px;padding:4px 6px;flex:0 0 auto;white-space:nowrap}
  .pright b{color:var(--txt);font-weight:600}
  .pbody{overflow:auto;flex:1;min-height:0}
  table.bb{width:100%;border-collapse:collapse;white-space:nowrap}
  table.bb th{color:var(--dim);font-weight:500;text-align:left;padding:6px 8px;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);z-index:1}
  table.bb td{padding:7px 8px;border-bottom:1px solid #161b26;vertical-align:middle}
  table.bb tbody tr:hover td{background:#141a25}
  table.bb tr[data-sym]{cursor:pointer}
  .ct{display:flex;align-items:center;gap:8px}
  .ct i{display:block;width:3px;height:32px;border-radius:2px}
  .ct i.long{background:var(--up)} .ct i.short{background:var(--dn)}
  .badge{font-size:10px;padding:1px 5px;border-radius:3px;background:#1c2333;color:var(--dim);margin-right:3px}
  .badge.long{background:rgba(22,199,154,.15);color:var(--up)}
  .badge.short{background:rgba(240,71,106,.15);color:var(--dn)}
  .empty{display:flex;align-items:center;justify-content:center;height:100%;min-height:80px;color:var(--dim);text-align:center;padding:10px;line-height:1.7}
  #foot{display:flex;gap:24px;padding:8px 14px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap;flex:none}
  @media (max-width:800px){#app{grid-template-columns:1fr}aside{display:none}header{grid-column:1}}
  /* TradingView 스타일 그리기 도구모음 */
  #chartRow{display:flex;flex:1;min-height:120px;min-width:0}
  #chartRow #chartWrap{min-width:0}
  #dtools{width:52px;flex:none;display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none;user-select:none}
  #dtools::-webkit-scrollbar{display:none}
  /* 차트 오른쪽 접이식 옵션 패널 */
  #optSide{flex:none;display:flex;flex-direction:column;align-items:flex-end;background:var(--panel);border-left:1px solid var(--line);user-select:none}
  #optToggle,#fsBtn{width:28px;height:28px;margin:6px 0 0;padding:0;border:none;background:none;color:#d1d4dc;font-size:16px;line-height:1;border-radius:6px}
  #optToggle:hover,#fsBtn:hover{background:#2a2e39}
  #optPanel{display:none;align-self:stretch;flex:1;min-height:0;width:170px;padding:6px 12px 10px;flex-direction:column;gap:8px;overflow-y:auto;scrollbar-width:thin}
  #optSide.open #optPanel{display:flex}
  #optPanel label.chk{cursor:pointer;white-space:nowrap}
  #optPanel input[type=range]{width:100%;margin:0}
  .dbtn{position:relative;width:40px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#d1d4dc;cursor:pointer}
  .dbtn:hover{background:#2a2e39}
  .dbtn.sel{background:#2a2e39;color:#fff}
  .dbtn.on{background:#e0e3eb;color:#131722}
  .dbtn svg{display:block;pointer-events:none}
  .dcar{position:absolute;right:-6px;top:0;bottom:0;width:11px;display:none;align-items:center;justify-content:center;font-size:8px;color:#9598a1;background:#1e222d;border-radius:3px}
  .dbtn:hover .dcar{display:flex}
  .dcar:hover{background:#363a45;color:#fff}
  .dsep{width:30px;height:1px;background:var(--line);margin:4px 0;flex:none}
  .dfly{position:fixed;z-index:100;background:#1e222d;border:1px solid #363a45;border-radius:6px;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.55)}
  .dfly .dfi{display:flex;align-items:center;gap:8px;padding:4px 14px 4px 8px;color:#d1d4dc;cursor:pointer;font-size:13px;border-radius:4px;white-space:nowrap}
  .dfly .dfi:hover{background:#2a2e39}
  .dfly .dfi.cur{color:#fff;background:#2a2e39}
  .dfly.grid{display:grid;grid-template-columns:repeat(4,38px)}
  .dfly.grid .dfi{justify-content:center;font-size:20px;padding:4px}
  #draw{position:absolute;inset:0;pointer-events:none;z-index:7}
  #dstyle{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:9;display:none;align-items:center;gap:8px;padding:5px 10px;background:#1e222d;border:1px solid #363a45;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  #dstyle .dc{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:block}
  #dstyle .dc.on{border-color:#fff}
  #dstyle .dw{width:26px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:4px}
  #dstyle .dw u{width:16px;background:#d1d4dc;display:block}
  #dstyle .dw.on,#dstyle .dw:hover{background:#2a2e39}
  #dstyle .dsp{width:1px;height:18px;background:#363a45}
  #dstyle .ddel{cursor:pointer;font-size:14px}
  #zoomReset{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);z-index:9;display:none}
  #axClock{position:absolute;right:0;bottom:0;z-index:8;display:flex;align-items:center;justify-content:center;color:#b2b5be;font:11.5px/1 -apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;background:#0b0e14;pointer-events:none;white-space:nowrap;border-top:1px solid #1f2633;border-left:1px solid #1f2633}
  #chartWrap.ctool,#chartWrap.ctool *{cursor:crosshair!important}
  #chartWrap.cera,#chartWrap.cera *{cursor:not-allowed!important}
  #chartWrap.carrow,#chartWrap.carrow *{cursor:default!important}
  #chartWrap.cdot,#chartWrap.cdot *{cursor:none!important}
  #chartWrap.dmove,#chartWrap.dmove *{cursor:move!important}

  /* ============================================================
     모바일 / 태블릿 대응 (가로·세로 자동 맞춤, 분할선 길게 눌러 조절, 전체화면)
     ============================================================ */
  html,body{overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  #app{height:100vh;height:100dvh;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  select,button{touch-action:manipulation}
  #chartRow,#chartWrap{min-height:80px}
  #posPanel{min-height:64px}

  /* 차트 ↔ 포지션 경계선 (분할선) */
  #split{position:relative;z-index:5;height:8px;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;transition:background .12s}
  #split::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:3px;margin:-1.5px 0 0 -22px;border-radius:2px;background:#4a5568;transition:background .12s}
  #split.press{background:#2a4a85}
  #split.grab{background:var(--accent)}
  #split.grab::after{background:#fff}
  body.resizing,body.resizing *{cursor:row-resize!important;-webkit-user-select:none!important;user-select:none!important}
  @media (pointer:coarse){
    #split{height:16px}
    #split::before{content:"";position:absolute;left:0;right:0;top:-8px;bottom:-8px}   /* 손가락 터치 영역 확대 */
    #split::after{width:56px;height:4px;margin:-2px 0 0 -28px}
  }
  /* 분할선을 끝까지 끌었을 때: 차트 전체 / 포지션 전체 */
  main.fullChart #posPanel{display:none}
  main.fullPanel #chartRow{display:none}
  main.fullPanel #posPanel{flex:1 1 auto;height:auto!important}

  /* 전체화면 모드(작은 화면): 상단 시세 줄과 하단 요약을 접어서 차트·포지션이 화면을 다 씀 */
  @media (max-width:900px),(max-height:500px){ body.pfs header,body.pfs #foot{display:none} }

  /* 폰·태블릿 세로/가로 공통 */
  @media (max-width:900px),(max-height:500px){
    #app{grid-template-columns:1fr}
    aside{display:none}
    header{grid-column:1;flex-wrap:nowrap;gap:12px;padding:6px 10px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    header::-webkit-scrollbar{display:none}
    header .sym{position:sticky;left:0;z-index:3;flex:none;gap:10px;padding-right:10px;background:var(--panel)}
    header .stat{flex:none;white-space:nowrap}
    header .conn{flex:none;margin-left:0;white-space:nowrap}
    .symTxt b{font-size:16px}
    .price{font-size:17px}
    #symPop{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 54px);width:auto;max-height:calc(100vh - 70px);max-height:calc(100dvh - 70px)}
    #symQ{font-size:16px}               /* iOS 입력창 자동 확대 방지 */
    .toolbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:5px;padding:5px 8px}
    .toolbar::-webkit-scrollbar{display:none}
    .toolbar button{flex:none;min-height:30px;padding:4px 10px}
    #dtools{width:42px}
    .dbtn{width:36px}
    #chartRow{position:relative}
    #optSide{padding:0 1px}
    #optPanel{position:absolute;right:30px;top:0;bottom:0;width:176px;z-index:30;background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 20px rgba(0,0,0,.35)}
    .ptabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:0 4px}
    .ptabs::-webkit-scrollbar{display:none}
    .ptab{flex:none;padding:8px 10px}
    .pright{gap:10px}
    #foot{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:16px;padding:5px 10px}
    #foot::-webkit-scrollbar{display:none}
    #foot .stat{flex:none;white-space:nowrap}
    table.bb th,table.bb td{padding:6px}
  }
  /* 폰 가로모드(세로 공간이 좁을 때) */
  @media (max-height:500px){
    header{padding:3px 10px;gap:10px}
    .symTxt .sub{display:none}
    #symIcon .coin{width:24px!important;height:24px!important}
    .symTxt b{font-size:14px}
    .price{font-size:15px}
    #symPop{top:calc(env(safe-area-inset-top,0px) + 42px);max-height:calc(100vh - 54px);max-height:calc(100dvh - 54px)}
    .toolbar{padding:3px 8px}
    .toolbar button{min-height:26px;padding:2px 9px}
    .ptab{padding:6px 10px}
    #foot{display:none}
  }

  /* 터치 기기: 도구모음 하위 메뉴·스타일 바 크기 */
  @media (hover:none){ .dcar{display:flex} }
  @media (max-width:900px),(max-height:500px){ #dtools{width:46px} .dcar{right:-5px;width:12px} }
  @media (pointer:coarse){
    #chartWrap{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
    .dfly .dfi{padding:10px 16px 10px 10px;font-size:14px}
    .dfly.grid{grid-template-columns:repeat(4,46px)}
    .dfly.grid .dfi{padding:8px}
    #dstyle{flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 12px);gap:6px 8px;padding:6px 8px}
    #dstyle .dc{width:22px;height:22px}
    #dstyle .dw{width:30px;height:28px}
    #dstyle .ddel{font-size:20px;padding:0 4px}
    #dstyle .dsp{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="sym">
      <select id="symSel" style="display:none">
        <option>BTCUSDT</option><option>ETHUSDT</option><option>SOLUSDT</option>
        <option>XRPUSDT</option><option>DOGEUSDT</option><option>BNBUSDT</option><option>ZECUSDT</option>
      </select>
      <div class="symPick">
        <button id="symBtn" type="button" title="종목 변경">
          <span class="menu"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 5h10M3 10h14M3 15h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></span>
          <span id="symIcon"></span>
          <span class="symTxt"><b id="symName">BTCUSDT</b><span class="sub"><span id="symSub">Bitcoin</span><span class="symInfo" title="바이비트 USDT 무기한 계약">i</span></span></span>
        </button>
        <div id="symPop">
          <input id="symQ" type="text" placeholder="종목 검색 (예: PEPE, 솔라나, sol)" autocomplete="off" spellcheck="false">
          <div id="symCnt"></div>
          <div id="symList"></div>
        </div>
      </div>
      <span class="price num" id="price">-</span>
      <span class="num" id="chg">-</span>
    </div>
    <div class="stat"><span class="k">24h 거래대금</span><span class="num" id="vol24">-</span></div>
    <div class="stat"><span class="k">펀딩비</span><span class="num" id="fund">-</span></div>
    <div class="stat"><span class="k">다음 펀딩까지</span><span class="num" id="fundT">-</span></div>
    <div class="stat"><span class="k">미결제약정(OI)</span><span class="num" id="oi">-</span></div>
    <div class="stat"><span class="k">롱/숏 계정비율(5m)</span><span class="num" id="ls">-</span></div>
    <div class="stat"><span class="k">마크가 / 인덱스</span><span class="num" id="mark">-</span></div>
    <div class="stat"><span class="k">USDT 가격 (업비트)</span><span class="num" id="usdt">-</span></div>
    <div class="conn"><span class="dot" id="dot"></span><span id="connTxt">연결 중…</span><span class="num" id="clock"></span></div>
  </header>

  <aside>
    <div class="box">
      <h3><span>고래 체결 (Whale Trades)</span>
        <select id="thrSel">
          <option value="50000">≥ $50K</option>

(() => {

  whales: [], liqs: [], symLiqs: [],

};

/* ---------- 포맷터 ---------- */
const fmtUSD = v => {
  const a = Math.abs(v);
  if (a >= 1e9) return (v/1e9).toFixed(2)+'B';
  if (a >= 1e6) return (v/1e6).toFixed(2)+'M';
  if (a >= 1e3) return (v/1e3).toFixed(1)+'K';
  return v.toFixed(0);
};
const fmtVol = v => v >= 1e6 ? (v/1e6).toFixed(2)+'M' : v >= 1e3 ? (v/1e3).toFixed(2)+'K' : v.toFixed(2);

const fmtPrice = p => nf(p, decimalsFor(p));

/* ---------- 데이터 로딩 ---------- */
async function jget(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(r.status+' '+url);
  return r.json();
}

/* 캔들 히스토리: 처음에 최대치(1500개)를 불러오고, 왼쪽 끝으로 스크롤하면 더 과거를 계속 이어서 불러온다 (실제 거래소처럼) */
const HIST_MAX = 1500, HIST_CAP = 120000;       // 1회 요청 최대 개수(바이낸스 한도) / 총 상한(브라우저 부담 방지)
const hist = {oldest: 0, loading: false, done: false, total: 0};
const volColor = (c,o) => c>=o ? 'rgba(22,199,154,.45)' : 'rgba(240,71,106,.45)';
function parseKlines(k){
  const cs = [], vs = [];
  for (const x of k){
    const t = x[0]/1000 + KST;
    const o=+x[1],h=+x[2],l=+x[3],c=+x[4],v=+x[5];
    cs.push({time:t,open:o,high:h,low:l,close:c});
    vs.push({time:t,value:v,color:volColor(c,o)});
    qvol.set(t, +x[7] || 0);
  }
  return {cs, vs};
}
async function loadHistory(){
  const sym = state.sym, tf = state.tf;
  const k = await jget(`${REST}/fapi/v1/klines?symbol=${sym}&interval=${tf}&limit=${HIST_MAX}`);
  if (sym!==state.sym || tf!==state.tf) return;
  qvol.clear();
  const {cs, vs} = parseKlines(k);
  candle.setData(cs); volume.setData(vs);
  hist.oldest = k[0][0]; hist.total = k.length; hist.loading = false; hist.done = k.length < HIST_MAX;
  state.lastCandle = cs[cs.length-1];
  state.lastVol = vs[vs.length-1].value;
  const dec = decimalsFor(state.lastCandle.close);
  candle.applyOptions({priceFormat:{type:'price',precision:dec,minMove:Math.pow(10,-dec)}});
  chart.timeScale().scrollToRealTime();
  renderLegend();
}
async function loadOlder(){
  if (hist.loading || hist.done || !hist.oldest) return;
  if (hist.total >= HIST_CAP){ hist.done = true; return; }
  hist.loading = true;
  const sym = state.sym, tf = state.tf;
  try{
    const k = await jget(`${REST}/fapi/v1/klines?symbol=${sym}&interval=${tf}&limit=${HIST_MAX}&endTime=${hist.oldest-1}`);
    if (sym!==state.sym || tf!==state.tf) return;
    if (!k.length){ hist.done = true; return; }
    const {cs, vs} = parseKlines(k);
    const range = chart.timeScale().getVisibleLogicalRange();
    candle.setData(cs.concat(candle.data()));          // 현재 실시간 캔들까지 포함된 데이터 앞에 과거를 붙임
    volume.setData(vs.concat(volume.data()));
    if (range) chart.timeScale().setVisibleLogicalRange({from: range.from + cs.length, to: range.to + cs.length});   // 보던 위치 유지
    hist.oldest = k[0][0]; hist.total += k.length;
    if (k.length < HIST_MAX) hist.done = true;
  }catch(e){ console.warn('과거 캔들 로딩 실패', e); }
  finally{ if (sym===state.sym && tf===state.tf) hist.loading = false; }
}
chart.timeScale().subscribeVisibleLogicalRangeChange(r => { if (r && r.from < 150) loadOlder(); });

async function loadRecentTrades(){
  // 접속 직후 버블이 비어 보이지 않도록 최근 체결 1000건 보충
  try{
    const sym = state.sym;
    const a = await jget(`${REST}/fapi/v1/aggTrades?symbol=${sym}&limit=1000`);
    if (sym!==state.sym) return;
    for (const x of a){

    state.whales.sort((a,b)=>a.t-b.t);
    renderWhales();

}

/* ---------- 웹소켓 ---------- */
function connect(){
  if (state.ws){ state.closed = true; try{state.ws.close();}catch{} }
  const s = state.sym.toLowerCase();
  const streams = [`${s}@aggTrade`,`${s}@kline_${state.tf}`,`${s}@ticker`,`${s}@markPrice@1s`,'!forceOrder@arr'].join('/');
  const ws = new WebSocket(WS+streams);
  state.ws = ws; state.closed = false;
  setConn('연결 중…', null);
  ws.onopen  = () => { state.reconnect = 0; setConn('실시간 연결됨', true); };
  ws.onerror = () => setConn('연결 오류', false);
  ws.onclose = () => {
    if (state.ws !== ws || state.closed) return;
    setConn('끊김 — 재연결 중…', false);
    const wait = Math.min(15000, 1000*Math.pow(2, state.reconnect++));
    setTimeout(()=>{ if(state.ws===ws) connect(); }, wait);
  };
  ws.onmessage = ev => {
    let m; try{ m = JSON.parse(ev.data); }catch{ return; }
    const d = m.data; if(!d) return;
    switch (d.e){
      case 'aggTrade':    onTrade(d); break;
      case 'kline':       onKline(d.k); break;
      case '24hrTicker':  onTicker(d); break;
      case 'markPriceUpdate': onMark(d); break;
      case 'forceOrder':  onLiq(d.o); break;
    }
  };
}
function setConn(txt, ok){
  exStat.binance = ok===true ? 'ok' : ok===false ? 'err' : 'conn'; renderExBar();
  $('connTxt').textContent = txt;
  $('dot').className = 'dot' + (ok===true?' ok':ok===false?' bad':'');
}

/* ---------- 이벤트 처리 ---------- */
function onKline(k){
  const t = k.t/1000 + KST, o=+k.o,h=+k.h,l=+k.l,c=+k.c,v=+k.v;
  const bar = {time:t,open:o,high:h,low:l,close:c};
  candle.update(bar);
  volume.update({time:t,value:v,color:c>=o?'rgba(22,199,154,.45)':'rgba(240,71,106,.45)'});
  qvol.set(t, +k.q || 0);
  state.lastCandle = bar; state.lastVol = v;
  if (!state.hover) renderLegend();
}
function onTicker(d){
  const p=+d.c, pct=+d.P;
  $('price').textContent = fmtPrice(p);
  $('price').className = 'price num ' + (pct>=0?'up':'dn');
  $('chg').textContent = (pct>=0?'+':'')+pct.toFixed(2)+'%';
  $('chg').className = 'num ' + (pct>=0?'up':'dn');
  $('vol24').textContent = '$'+fmtUSD(+d.q);
  document.title = `${fmtPrice(p)} ${state.sym} · 내 퀀트 대시보드`;
}
function onMark(d){
  const fr = +d.r*100;
  $('fund').textContent = fr.toFixed(4)+'%';
  $('fund').className = 'num ' + (fr>=0?'up':'dn');
  const left = Math.max(0, d.T - Date.now());
  const h = left/3600000|0, m = (left%3600000)/60000|0, s = (left%60000)/1000|0;
  $('fundT').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  $('mark').textContent = fmtPrice(+d.p)+' / '+fmtPrice(+d.i);
}
function onTrade(d){
  const p=+d.p, usd=p*+d.q;
  addWhale({t:d.T,p,usd,buy:!d.m,ex:'binance'});      // m=true → 매수자가 메이커 → 시장가 매도
}
/* ---------- 고래 사운드 (WebAudio 합성 차임, 외부 파일 없음) ----------
   매수 = 밝은 상승 차임 / 매도 = 부드러운 하강 차임. 체결 규모(임계값 대비 배수)가 클수록 음이 늘어남.
   두 방향의 체감 음량이 같도록 음높이별 보정 + 컴프레서 + 로우패스로 거슬리지 않게 처리 */
const SND = {ctx:null, master:null, ready:false, last:0};
const HZ = {E4:329.63, G4:415.30, B4:493.88, E5:659.25, G5:830.61, B5:987.77, E6:1318.51};   // E 메이저 펜타토닉 계열
const SND_SEQ = {
  buy:  {1:['E5','B5'],        2:['E5','G5','B5'],        3:['E5','G5','B5','E6']},
  sell: {1:['B4','E4'],        2:['B4','G4','E4'],        3:['E5','B4','G4','E4']}
};
function sndInit(){
  if (SND.ctx) return;
  try{
    const c = SND.ctx = new (window.AudioContext||window.webkitAudioContext)();
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -22; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.3;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2800; lp.Q.value = 0.3;
    SND.master = c.createGain(); SND.master.gain.value = $('sndVol').value/100;
    // 짧은 에코로 여운을 살짝 더함
    const dly = c.createDelay(0.5); dly.delayTime.value = 0.11;
    const fb = c.createGain(); fb.gain.value = 0.32; const wet = c.createGain(); wet.gain.value = 0.28;
    dly.connect(fb); fb.connect(dly); dly.connect(wet);
    SND.in = c.createGain(); SND.in.connect(lp); SND.in.connect(dly); wet.connect(lp);
    lp.connect(comp); comp.connect(SND.master); SND.master.connect(c.destination);
    SND.ready = true;
  }catch(e){ SND.ctx = null; }
}
// 브라우저 자동재생 정책: 화면을 한 번 클릭/키 입력하면 소리가 활성화됨
['pointerdown','keydown'].forEach(ev => window.addEventListener(ev, ()=>{ sndInit(); if (SND.ctx && SND.ctx.state==='suspended') SND.ctx.resume(); }, {passive:true}));
function sndNote(freq, t, dur, vol){
  const c = SND.ctx, g = c.createGain();
  // 기음 + 2배음 + 약한 비화성 부분음 = 맑은 벨 느낌
  [[1,1],[2,0.12],[3,0.025]].forEach(([m,a])=>{
    const o = c.createOscillator(), og = c.createGain();
    o.type = 'sine'; o.frequency.value = freq*m; og.gain.value = a;
    o.connect(og); og.connect(g); o.start(t); o.stop(t+dur+0.05);
  });
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.025);              // 아주 부드러운 어택
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);             // 벨처럼 자연스럽게 감쇠
  g.connect(SND.in);
}
function playWhale(w){
  if (!$('chkSnd').checked || !SND.ready || !SND.ctx || SND.ctx.state!=='running') return;
  const ratio = w.usd / state.thr;
  const tier = ratio >= 8 ? 3 : ratio >= 3 ? 2 : 1;                 // 1=소 2=중 3=대
  const now = performance.now();
  if (now - SND.last < (tier===1 ? 250 : tier===2 ? 150 : 60)) return;   // 작은 체결이 몰릴 때 소리 겹침 방지
  SND.last = now;
  const notes = SND_SEQ[w.buy ? 'buy' : 'sell'][tier];
  const step = 0.095, t0 = SND.ctx.currentTime + 0.01;
  const base = 0.11 + 0.03*tier;                                    // 규모가 클수록 조금 더 크게
  notes.forEach((k,i)=>{
    const f = HZ[k], last = i === notes.length-1;
    const eq = f < 500 ? 1.5 : f < 700 ? 1.2 : 1;                   // 낮은 음은 같은 음량이어도 작게 들려서 보정
    sndNote(f, t0 + i*step, last ? (tier===3 ? 1.2 : 0.8) : 0.45, base*eq);
  });
}
$('sndVol').oninput = e => { if (SND.master) SND.master.gain.value = e.target.value/100; };
/* ---------- 고래 플래시: 100만 달러 이상 체결 시 차트 절반에 그라데이션이 깜박임 ----------
   숏(시장가 매도) = 위쪽 절반 빨강 / 롱(시장가 매수) = 아래쪽 절반 초록. 금액이 클수록 진해짐 */
let flashLive = 0;
function flashWhale(w){
  if (w.usd < 1e6 || !$('chkFlash').checked || flashLive >= 6) return;
  const a = Math.min(0.42, 0.10 + 0.32*Math.log10(w.usd/1e6));      // 1M=0.10 → 10M 이상=0.42
  const el = document.createElement('i');
  const col = w.buy ? '22,199,154' : '240,71,106';
  if (w.buy){ el.style.bottom = '0'; el.style.background = `linear-gradient(to top, rgba(${col},${a}) 0%, rgba(${col},${a*0.4}) 45%, rgba(${col},0) 100%)`; }
  else      { el.style.top = '0';    el.style.background = `linear-gradient(to bottom, rgba(${col},${a}) 0%, rgba(${col},${a*0.4}) 45%, rgba(${col},0) 100%)`; }
  $('flashLayer').appendChild(el); flashLive++;
  const big = w.usd >= 5e6;                                          // 500만 이상은 두 번 깜박
  const kf = big ? [{opacity:0},{opacity:1,offset:.12},{opacity:.25,offset:.4},{opacity:.9,offset:.55},{opacity:0}]
                 : [{opacity:0},{opacity:1,offset:.15},{opacity:0}];
  const an = el.animate(kf, {duration: big ? 1100 : 700, easing:'ease-out'});
  an.onfinish = an.oncancel = () => { el.remove(); flashLive--; };
}
function addWhale(w){
  const usd = w.usd;
  if (!(usd >= state.thr) || !exOn[w.ex]) return;
  state.whales.push(w);
  if (w.buy) state.stats.buy += usd; else state.stats.sell += usd;
  playWhale(w);
  flashWhale(w);
  if (state.whales.length > 600) state.whales.splice(0, state.whales.length-600);
  renderWhales(); renderFoot();
}
function onLiq(o){
  const usd = (+o.ap || +o.p) * +o.z;
  if (!usd) return;
  addLiq({t:o.T, s:o.s, usd, longLiq:o.S === 'SELL', p:+o.ap || +o.p, ex:'binance'});     // 강제 매도 = 롱 청산
}
function addLiq(item){       // 모든 거래소 공통: item = {t, s(예 BTCUSDT), usd, longLiq, p, ex}
  if (!exOn[item.ex]) return;
  const usd = item.usd;
  if (item.longLiq) state.stats.ll += usd; else state.stats.ls += usd;
  if (usd >= state.liqThr){
    state.liqs.push(item);
    if (state.liqs.length > 200) state.liqs.shift();
    renderLiqs();
  }
  if (item.s === state.sym){
    state.symLiqs.push(item);
    if (state.symLiqs.length > 300) state.symLiqs.shift();
  }
  renderFoot();
}

/* ---------- 멀티 거래소 고래 체결 (공개 웹소켓, API 키 불필요) ----------
   각 어댑터: prep(base) → {url, sub:[구독 메시지], ...} / msg(d, cfg, emit, ws) → emit(시각ms, 가격, 체결금액USD, 매수여부)
   ping: 주기적으로 보낼 하트비트, gz: 압축(gzip) 메시지 여부, beta: 문서만 보고 작성해 아직 검증 못 한 거래소 */
const exOn = {}, exStat = {};
(() => { let saved = {}; try{ saved = JSON.parse(localStorage.getItem('exOn')||'{}'); }catch{} for (const k in EXCH) exOn[k] = saved[k] !== false; })();

const runners = {};
function setExStat(id, st){ exStat[id] = st; renderExBar(); }
function stopEx(id){ const r = runners[id]; if (r){ r.stop(); delete runners[id]; } setExStat(id, 'off'); }
function startEx(id){
  const A = ADAPT[id], base = state.sym.replace(/USDT$/, ''), sym = state.sym;
  let alive = true, ws = null, ping = null, retry = 0, timer = null;
  const stop = () => { alive = false; clearInterval(ping); clearTimeout(timer); try{ ws && ws.close(); }catch{} };
  runners[id] = {stop, sym};
  const emit = (t, p, usd, buy) => { if (alive && p > 0 && usd > 0) addWhale({t, p, usd, buy, ex:id}); };
  const emitLiq = (t, sy, p, usd, longLiq) => { if (alive && usd > 0) addLiq({t, s:sy, p, usd, longLiq, ex:id}); };
  const later = () => { if (!alive) return; setExStat(id, 'err'); timer = setTimeout(go, Math.min(30000, 2000*Math.pow(2, retry++))); };
  const go = async () => {
    if (!alive) return;
    setExStat(id, 'conn');
    let cfg;
    try{ cfg = await A.prep(base); }catch(e){ if (e === 'na'){ if (alive) setExStat(id, 'na'); return; } console.warn(id, '준비 실패', e); return later(); }
    if (!alive) return;
    ws = new WebSocket(cfg.url);
    if (A.gz) ws.binaryType = 'arraybuffer';
    const send = m => { if (ws.readyState === 1) ws.send(typeof m === 'string' ? m : JSON.stringify(m)); };
    ws.onopen = () => { retry = 0; setExStat(id, 'ok'); cfg.sub.forEach(send); clearInterval(ping); if (A.ping) ping = setInterval(() => send(A.ping()), A.pingMs); };
    ws.onmessage = async ev => {
      if (!alive) return;
      try{
        let t = ev.data;
        if (A.gz) t = await gunzip(t);
        if (id === 'bingx' && t === 'Ping'){ send('Pong'); return; }
        let d; try{ d = JSON.parse(t); }catch{ return; }
        if (d) A.msg(d, cfg, emit, ws, emitLiq);
      }catch(e){ console.warn(id, '메시지 처리 실패', e); }
    };
    ws.onerror = () => {};
    ws.onclose = () => { clearInterval(ping); if (alive) later(); };
  };
  go();
}
function syncExchanges(){
  for (const id in ADAPT){
    const r = runners[id];
    if (exOn[id] && (!r || r.sym !== state.sym)){ if (r) stopEx(id); startEx(id); }
    else if (!exOn[id] && r) stopEx(id);
  }
}

function drawBubbles(){
  const cv = $('bubbles'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  const step = TF_SEC[state.tf];
  const ts = chart.timeScale();
  const W = cv.width/dpr, H = cv.height/dpr;
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,ts.width(),chart.paneSize().height); ctx.clip();      // 가격축·시간축 영역에는 그리지 않음

  if ($('chkLiq').checked){
    // 롱 청산 마커는 '해당 캔들 저가 아래', 숏 청산 마커는 '해당 캔들 고가 위'에 표시 (청산 가격이 캔들 범위 밖이어도 거래량 영역으로 내려가지 않음)
    const lowMap = new Map(), highMap = new Map();
    for (const c of candle.data()){ lowMap.set(c.time, c.low); highMap.set(c.time, c.high); }
    const groups = new Map();      // 같은 캔들·같은 방향의 청산은 한 마커로 합산
    for (const l of state.symLiqs){
      const bt = Math.floor(l.t/1000/step)*step + KST;
      if (!lowMap.has(bt)) continue;
      const key = bt+'|'+(l.longLiq?1:0);
      const g = groups.get(key) || {bt, usd:0, longLiq:l.longLiq};
      g.usd += l.usd; groups.set(key, g);
    }
    for (const g of groups.values()){
      const x = ts.timeToCoordinate(g.bt);
      const yEdge = candle.priceToCoordinate(g.longLiq ? lowMap.get(g.bt) : highMap.get(g.bt));
      if (x==null || yEdge==null || x<0 || x>W) continue;
      const r = Math.min(10, Math.max(4, Math.sqrt(g.usd/20000)*3));
      const y = g.longLiq ? yEdge + 6 + r : yEdge - 6 - r;     // 롱=저가 아래, 숏=고가 위 (방향별로 한 마커씩이라 겹치지 않음)
      if (y<0 || y>H) continue;
      ctx.beginPath();
      if (g.longLiq){ ctx.moveTo(x,y+r); ctx.lineTo(x-r,y-r); ctx.lineTo(x+r,y-r); }
      else          { ctx.moveTo(x,y-r); ctx.lineTo(x-r,y+r); ctx.lineTo(x+r,y+r); }
      ctx.closePath();
      ctx.fillStyle = g.longLiq ? '#16c79a' : '#f0476a'; ctx.fill();   // 롱 청산=초록, 숏 청산=빨강
    }
  }
  if ($('chkHL').checked){
    // 현재 화면에 보이는 구간의 최고가/최저가를 해당 캔들 옆에 표시
    const vr = ts.getVisibleLogicalRange(), data = candle.data();
    if (vr && data.length){
      const a = Math.max(0, Math.ceil(vr.from)), b = Math.min(data.length-1, Math.floor(vr.to));
      let hi = null, lo = null;
      for (let i=a; i<=b; i++){
        const c = data[i];
        if (!hi || c.high > hi.v) hi = {v:c.high, time:c.time};
        if (!lo || c.low  < lo.v) lo = {v:c.low,  time:c.time};
      }
      ctx.font = '11px ui-monospace,Consolas,monospace'; ctx.textBaseline = 'middle'; ctx.lineWidth = 1;
      for (const pt of [hi, lo]){
        if (!pt) continue;
        const x = ts.timeToCoordinate(pt.time), y = candle.priceToCoordinate(pt.v);
        if (x==null || y==null) continue;
        const txt = fp(pt.v), left = x + 20 + ctx.measureText(txt).width > ts.width(), d = left ? -1 : 1;   // 오른쪽 끝에 닿으면 왼쪽에 표시
        ctx.strokeStyle = ctx.fillStyle = '#d7dde8';
        ctx.beginPath(); ctx.moveTo(x + d*4, y); ctx.lineTo(x + d*16, y); ctx.stroke();
        ctx.textAlign = left ? 'right' : 'left'; ctx.fillText(txt, x + d*20, y);
      }
    }
  }
  ctx.restore();
}

function tblExec(list){
  const rows = list.map(x => {
    const buy = x.side === 'Buy', fee = +x.execFee || 0;
    const typ = ({Trade:'체결', Funding:'펀딩', AdlTrade:'ADL', BustTrade:'강제청산', Settle:'정산'})[x.execType] || esc(x.execType);
    return `<tr data-sym="${esc(x.symbol)}">
      <td class="num dim">${kstTime(x.execTime)}</td>
      <td><b>${esc(x.symbol)}</b> <span class="dim">무기한</span></td>
      <td class="${buy?'up':'dn'}">${buy?'매수':'매도'}</td>
      <td>${typ}${isTrue(x.isMaker) ? ' <span class="dim">· Maker</span>' : ' <span class="dim">· Taker</span>'}</td>
      <td class="num">${fp(x.execPrice)}</td>
      <td class="num">${trimNum(x.execQty)} <span class="dim">${esc(baseOf(x.symbol))}</span></td>
      <td class="num">${nf(+x.execValue||0,4)} <span class="dim">USDT</span></td>
      <td class="num ${cls(-fee)}">${nf(fee,4)}</td>
    </tr>`;
  }).join('');
  return `<table class="bb"><thead><tr><th>체결 시간</th><th>계약</th><th>방향</th><th>유형</th><th>체결 가격</th><th>수량</th><th>체결 가치</th><th>수수료(USDT)</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function tblPnl(list){
  const rows = list.map(x => {
    const long = x.side === 'Sell';          // 청산 주문이 매도 = 롱 포지션을 닫은 것
    const pnl = +x.closedPnl || 0;
    return `<tr data-sym="${esc(x.symbol)}">
      <td class="num dim">${kstTime(x.updatedTime || x.createdTime)}</td>
      <td><b>${esc(x.symbol)}</b> <span class="dim">무기한</span></td>
      <td><span class="badge ${long?'long':'short'}">${long?'롱':'숏'}</span> <span class="dim">${x.leverage ? (+x.leverage)+'x' : ''}</span></td>
      <td class="num">${trimNum(x.qty)} <span class="dim">${esc(baseOf(x.symbol))}</span></td>
      <td class="num">${fp(x.avgEntryPrice)}</td>
      <td class="num">${fp(x.avgExitPrice)}</td>
      <td class="num ${cls(pnl)}">${sgn(pnl)} <span class="dim">USDT</span></td>
    </tr>`;
  }).join('');
  return `<table class="bb"><thead><tr><th>시간</th><th>계약</th><th>포지션</th><th>수량</th><th>진입 평균가</th><th>청산 평균가</th><th>실현 손익</th></tr></thead><tbody>${rows}</tbody></table>`;
}

let lastPanelHtml = '';

function renderPanel(){
  const snap = state.snap;
  // 상태 표시
  let dot = null, txt = '-', msg = '';
  if (!HAS_SERVER){
    txt = '서버 미연결'; dot = false;
    msg = '포지션 패널은 <b>dashboard_server.py</b> 를 실행한 뒤<br><b>http://127.0.0.1:8787</b> 로 접속해야 표시됩니다.<br><span class="dim">(HTML 파일을 더블클릭해서 연 경우에는 동작하지 않아요)</span>';
  } else if (state.snapErr && !snap){
    txt = '서버 응답 없음'; dot = false;
    msg = 'dashboard_server.py 가 실행 중인지 확인하세요.<br><span class="dim">' + esc(state.snapErr) + '</span>';
  } else if (!snap){
    txt = '불러오는 중…';
  } else if (!snap.ok){
    txt = '바이비트 오류'; dot = false;
    msg = '바이비트 조회에 실패했습니다.<br><span class="dim">' + esc(snap.error || '') + '</span>';
  } else {
    dot = true; txt = (snap.demo ? '바이비트 데모' : '바이비트') + (snap.readOnly === true ? ' · 읽기전용 키' : snap.readOnly === false ? ' · ⚠ 거래권한 키' : '');
  }
  $('bbDot').className = 'dot' + (dot===true?' ok':dot===false?' bad':'');
  $('bbStat').textContent = txt;
  const w = snap && snap.wallet;
  $('acct').innerHTML = w && w.totalEquity != null
    ? `자산 <b class="num">${nf(+w.totalEquity,2)}</b> · 사용가능 <b class="num">${nf(+w.totalAvailableBalance||0,2)}</b> · 미실현 <b class="num ${cls(+w.totalPerpUPL||0)}">${sgn(+w.totalPerpUPL||0,2)}</b> USDT`
    : '';

  const pos = snap ? filt(snap.positions||[]) : [], open = snap ? filt(snap.orders||[]) : [];
  $('cntPos').textContent = snap ? `(${pos.length})` : '';
  $('cntOpen').textContent = snap ? `(${open.length})` : '';

  let html;
  if (msg) html = `<div class="empty"><div>${msg}</div></div>`;
  else if (!snap) html = '<div class="empty">불러오는 중…</div>';
  else {
    const want = {pos, open, hist: filt(snap.history||[]), exec: filt(snap.executions||[]), pnl: filt(snap.closedPnl||[])}[state.tab];
    const label = {pos:'보유 중인 포지션이', open:'대기 중인 주문이', hist:'주문 내역이', exec:'체결 내역이', pnl:'실현 손익 내역이'}[state.tab];
    if (!want.length) html = `<div class="empty">${label} 없습니다.${state.onlySym ? '<br><span class="dim">“현재 심볼만”이 켜져 있어요.</span>' : ''}</div>`;
    else html = state.tab==='pos' ? tblPos(want) : state.tab==='open' ? tblOrders(want,false) : state.tab==='hist' ? tblOrders(want,true)
              : state.tab==='exec' ? tblExec(want) : tblPnl(want);
  }
  if (html !== lastPanelHtml){ $('pbody').innerHTML = html; lastPanelHtml = html; }
}

function clearLines(){ for (const l of state.lines) { try{ candle.removePriceLine(l); }catch{} } state.lines = []; state.lineKey = ''; }
function syncLines(){
  const snap = state.snap;
  if (!$('chkLines').checked || !snap || !snap.ok){ if (state.lines.length) clearLines(); return; }
  const want = [];
  for (const p of snap.positions||[]){
    if (p.symbol !== state.sym) continue;
    const long = p.side === 'Buy', col = long ? '#16c79a' : '#f0476a';
    want.push({price:+p.avgPrice, color:col, style:0, title:`${long?'롱':'숏'} ${trimNum(p.size)} 평단`});
    if (+p.liqPrice) want.push({price:+p.liqPrice, color:'#ff9f1a', style:2, title:`${long?'롱':'숏'} 청산가`});
    if (+p.takeProfit) want.push({price:+p.takeProfit, color:'#16c79a', style:3, title:'TP'});
    if (+p.stopLoss) want.push({price:+p.stopLoss, color:'#f0476a', style:3, title:'SL'});
  }
  for (const o of snap.orders||[]){
    if (o.symbol !== state.sym || !+o.price) continue;
    const red = isTrue(o.reduceOnly);
    want.push({price:+o.price, color: red ? '#8fa3c7' : '#4c8dff', style:2, title:`${orderKind(o)} ${trimNum(o.qty)}`});
  }
  const key = JSON.stringify(want);
  if (key === state.lineKey) return;
  clearLines();
  state.lineKey = key;
  for (const w of want){
    state.lines.push(candle.createPriceLine({price:w.price, color:w.color, lineWidth:1, lineStyle:w.style, axisLabelVisible:true, title:w.title}));
  }
}

async function pollSnap(){
  if (HAS_SERVER){
    try{
      const r = await fetch('/api/snapshot', {cache:'no-store'});
      if (!r.ok) throw new Error('HTTP '+r.status);
      state.snap = await r.json(); state.snapErr = null;
    }catch(e){ state.snapErr = String(e.message||e); }
  }
  renderPanel(); syncLines();
}

/* ---------- 좌표 변환 (시간·가격 ↔ 화면) ---------- */
let B=null;
function base(){ B=null; const lc=state.lastCandle; if(!lc) return null; const x=ts.timeToCoordinate(lc.time); if(x==null) return null;
  const l=ts.coordinateToLogical(x); if(l==null) return null; B={li:Math.round(l),lt:lc.time,st:TF_SEC[state.tf]}; return B; }
const tToL=t=>B.li+(t-B.lt)/B.st, lToT=l=>B.lt+(l-B.li)*B.st;
const X=t=>B?ts.logicalToCoordinate(tToL(t)):null, Y=p=>candle.priceToCoordinate(p);
function pt(x,y){
  if(!base()) return null;
  const l=ts.coordinateToLogical(x); let p=candle.coordinateToPrice(y); if(l==null||p==null) return null;
  let t=lToT(l);
  D.snap=null;
  if (D.magnet){ const b=candle.dataByIndex(Math.round(l),0); if(b&&b.open!=null){ let best=null,bd=1e9;
    for (const v of [b.open,b.high,b.low,b.close]){ const yy=Y(v); if(yy==null) continue; const dd=Math.abs(yy-y); if(dd<bd){bd=dd;best=v;} }
    if (best!=null&&(D.magnet===2||bd<50)){ p=best; t=b.time; D.snap={t,p}; } } }
  return {t,p};
}
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;};
const fmtDur=s=>{s=Math.abs(s);const d=s/86400|0,h=s%86400/3600|0,m=s%3600/60|0;return [d&&d+'일',h&&h+'시간',m&&m+'분'].filter(Boolean).join(' ')||'0분';};
const ser=()=>JSON.stringify(D.list,(k,v)=>k[0]==='_'?undefined:v);
const save=()=>{ try{localStorage.setItem('dw:'+D.sym,ser());}catch{} };
const load=s=>{ try{D.list=JSON.parse(localStorage.getItem('dw:'+s)||'[]');}catch{D.list=[];} };
const pushHist=s=>{ D.hist.push(s); if(D.hist.length>60) D.hist.shift(); };

/* ---------- 오른쪽 일봉 캔들 ---------- */
async function pollDaily(){
  const sym=state.sym;
  try{ const r=await fetch(`${REST}/fapi/v1/klines?symbol=${sym}&interval=1d&limit=1`); const k=await r.json();
    if(sym!==state.sym||!k[0]) return; DC.sym=sym; DC.o=+k[0][1]; DC.h=+k[0][2]; DC.l=+k[0][3]; DC.c=+k[0][4]; DC.ok=true; }catch{}
}
setInterval(pollDaily,3000); pollDaily();
function paintDaily(c,aw,ah){
  if (!$('chkDay').checked||!DC.ok||DC.sym!==state.sym) return;
  const cl=state.lastCandle?state.lastCandle.close:DC.c,h=Math.max(DC.h,cl),l=Math.min(DC.l,cl);
  const yo=Y(DC.o),yc=Y(cl),yh=Y(h),yl=Y(l); if([yo,yc,yh,yl].some(v=>v==null)) return;   // 실제 가격 위치에 그림
  const col=cl>=DC.o?'#16c79a':'#f0476a',cx=aw-34,w=24,pc=(cl-DC.o)/DC.o*100;
  c.save(); c.strokeStyle=c.fillStyle=col; c.lineWidth=2; c.beginPath(); c.moveTo(cx,yh); c.lineTo(cx,yl); c.stroke();
  c.fillRect(cx-w/2,Math.min(yo,yc),w,Math.max(2,Math.abs(yc-yo)));
  c.font='bold 12px ui-monospace,Consolas,monospace'; c.textAlign='center'; c.textBaseline='middle';
  c.fillText((pc>0?'+':'')+pc.toFixed(1)+'%',cx,Math.min(yl+14,ah-8)); c.restore();
}

/* ---------- 그리기 ---------- */
function size(){ const r=wrap.getBoundingClientRect(),dpr=devicePixelRatio||1; cv.width=r.width*dpr; cv.height=r.height*dpr; cv.style.width=r.width+'px'; cv.style.height=r.height+'px'; }
function paint(c,d,aw,ah,sel){

  const col=d.color,segs=d._segs,rects=d._rects,a=P[0],b=P[1]||a,e=P[2]||b,dec=decimalsFor(a.p),step=TF_SEC[state.tf];
  c.save(); c.strokeStyle=col; c.fillStyle=col; c.lineWidth=d.w; c.lineJoin=c.lineCap='round'; c.setLineDash([]);

  const lab=(t,x,y,bg)=>{c.font='11px ui-monospace,Consolas,monospace';const w=c.measureText(t).width+10;c.fillStyle=bg;c.fillRect(x-w/2,y-9,w,18);c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.fillText(t,x,y);c.fillStyle=col;};
  const head=(x1,y1,x2,y2)=>{const an=Math.atan2(y2-y1,x2-x1),k=8+d.w*2;c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-k*Math.cos(an-.45),y2-k*Math.sin(an-.45));c.lineTo(x2-k*Math.cos(an+.45),y2-k*Math.sin(an+.45));c.closePath();c.fill();};
  const poly=Q=>{c.beginPath();Q.forEach((q,i)=>i?c.lineTo(q.x,q.y):c.moveTo(q.x,q.y));c.stroke();for(let i=1;i<Q.length;i++)segs.push([Q[i-1].x,Q[i-1].y,Q[i].x,Q[i].y]);};
  const clampX=v=>Math.max(16,Math.min(aw-16,v)),clampY=v=>Math.max(16,Math.min(ah-16,v));

   case 'trend': L(a.x,a.y,b.x,b.y); break;
   case 'ray': { const f=far(a,b,1e4); L(a.x,a.y,f[0],f[1]); } break;
   case 'ext': { const f=far(a,b,1e4),g=far(b,a,1e4); L(g[0],g[1],f[0],f[1]); } break;
   case 'hline': L(0,a.y,aw,a.y); d._hd=[[clampX(a.x),a.y]]; break;
   case 'hray': L(a.x,a.y,aw+10,a.y); break;
   case 'vline': L(a.x,0,a.x,ah); d._hd=[[a.x,clampY(a.y)]]; break;
   case 'channel': { L(a.x,a.y,b.x,b.y);
     if (P.length>2){ const off=e.p-(a.p+(b.p-a.p)*(e.t-a.t)/((b.t-a.t)||1e-9)), ya=Y(a.p+off), yb=Y(b.p+off);
       if (ya!=null&&yb!=null){ c.fillStyle=rgba(col,.1); c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.lineTo(b.x,yb); c.lineTo(a.x,ya); c.fill(); L(a.x,ya,b.x,yb); } } } break;
   case 'fib': { const LV=[[0,'#787b86'],[.236,'#f23645'],[.382,'#ff9800'],[.5,'#4caf50'],[.618,'#089981'],[.786,'#2196f3'],[1,'#787b86']];

     LV.forEach(([l,lc])=>{ const pr=b.p+(a.p-b.p)*l,y=Y(pr); if(y==null) return; c.strokeStyle=lc; L(x1,y,x2,y);
       if (py!=null){ c.globalAlpha=.1; c.fillStyle=lc; c.fillRect(x1,Math.min(y,py),x2-x1,Math.abs(y-py)); c.globalAlpha=1; rects.push([x1,Math.min(y,py),x2-x1,Math.abs(y-py)]); }
       c.fillStyle=lc; c.font='11px ui-monospace,Consolas,monospace'; c.textBaseline='middle'; const t=`${l} (${fmtPrice(pr)})`;
       if (x1>110){ c.textAlign='right'; c.fillText(t,x1-5,y); } else { c.textAlign='left'; c.fillText(t,x1+5,y-8); } py=y; }); } break;
   case 'path': case 'brush': poly(P); if(d.type==='brush') d._hd=[]; break;
   case 'long': case 'short': { const xl=Math.min(a.x,b.x),w=Math.abs(b.x-a.x)||1,yE=a.y,yT=b.y,yS=e.y,risk=Math.abs(a.p-e.p)||1e-12,rr=Math.abs(b.p-a.p)/risk;
     R(xl,Math.min(yE,yT),w,Math.abs(yT-yE),'rgba(8,153,129,.25)'); R(xl,Math.min(yE,yS),w,Math.abs(yS-yE),'rgba(242,54,69,.25)');
     c.strokeStyle='#787b86'; c.lineWidth=1; L(xl,yE,xl+w,yE); const pc=v=>((v-a.p)/a.p*100).toFixed(2)+'%',cx=xl+w/2;
     lab(`목표 ${fmtPrice(b.p)} (${pc(b.p)})`,cx,yT+(yT<yE?-12:12),'#089981'); lab(`손절 ${fmtPrice(e.p)} (${pc(e.p)})`,cx,yS+(yS<yE?-12:12),'#f23645');
     lab(`${d.type==='long'?'롱':'숏'} · 손익비 ${rr.toFixed(2)}`,cx,yE,'#363a45'); d._hd=[[a.x,yE],[b.x,yT],[b.x,yS]]; } break;
   case 'prange': case 'drange': case 'measure': {

     const up=dp>=0,fc=d.type==='measure'?(up?'rgba(41,98,255,.2)':'rgba(242,54,69,.2)'):rgba(col,.15);

     R(x1,y1,x2-x1,y2-y1,fc); c.lineWidth=d.type==='measure'?1:d.w;
     if (d.type==='drange'){ L(a.x,y1,a.x,y2); L(b.x,y1,b.x,y2); L(a.x,ym,b.x,ym); head(a.x,ym,b.x,ym); lab(`${bars}봉 · ${fmtDur(b.t-a.t)}`,xm,y1-12,'#363a45'); }
     else { L(x1,a.y,x2,a.y); L(x1,b.y,x2,b.y); L(xm,a.y,xm,b.y); head(xm,a.y,xm,b.y);
       if (d.type==='prange') lab(`${dp>=0?'+':''}${nf(dp,dec)} (${pc.toFixed(2)}%)`,xm,y1-12,'#363a45');
       else lab(`${dp>=0?'+':''}${nf(dp,dec)} (${pc.toFixed(2)}%) · ${bars}봉 · ${fmtDur(b.t-a.t)}`,xm,up?y1-12:y2+12,up?'#2962ff':'#f23645'); }
     if (d.type==='measure') d._hd=[]; } break;
   case 'rect': R(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y),rgba(col,.15));
     c.strokeRect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y));
     { const x1=Math.min(a.x,b.x),y1=Math.min(a.y,b.y),x2=Math.max(a.x,b.x),y2=Math.max(a.y,b.y); segs.push([x1,y1,x2,y1],[x2,y1,x2,y2],[x2,y2,x1,y2],[x1,y2,x1,y1]); } break;
   case 'ellipse': { const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,rx=Math.abs(b.x-a.x)/2,ry=Math.abs(b.y-a.y)/2; if(rx>0&&ry>0){ c.beginPath(); c.ellipse(cx,cy,rx,ry,0,0,7); c.globalAlpha=.15; c.fill(); c.globalAlpha=1; c.stroke(); d._ell=[cx,cy,rx,ry]; } } break;

     const w=c.measureText(d.text).width; R(a.x-3,a.y-13,w+6,26); d._hd=[]; if(sel){c.setLineDash([3,3]);c.lineWidth=1;c.strokeRect(a.x-3,a.y-13,w+6,26);} } break;
   case 'emoji': { c.font='28px "Apple Color Emoji","Segoe UI Emoji",sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(d.emoji,a.x,a.y);
     R(a.x-16,a.y-16,32,32); d._hd=[]; if(sel){c.setLineDash([3,3]);c.lineWidth=1;c.strokeRect(a.x-17,a.y-17,34,34);} } break;

function draw(){
  const dpr=devicePixelRatio||1,W=cv.width/dpr,H=cv.height/dpr,c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,H);
  const pw=chart.priceScale('right').width()||92,th=(ts.height&&ts.height())||28,aw=W-pw,ah=H-th; D.area={w:aw,h:ah};
  const clk=$('axClock'); clk.style.width=pw+'px'; clk.style.height=th+'px';
  if (!base()) return;
  c.save(); c.beginPath(); c.rect(0,0,aw,ah); c.clip();
  paintDaily(c,aw,ah);
  if (!D.hide) for (const d of D.list) paint(c,d,aw,ah,d===D.sel);
  if (D.draft) paint(c,D.draft,aw,ah,true);
  if (D.measure) paint(c,D.measure,aw,ah,false);
  if (D.zoomBox){ const z=D.zoomBox; c.setLineDash([4,3]); c.strokeStyle='#2962ff'; c.fillStyle='rgba(41,98,255,.15)'; c.fillRect(z.x0,z.y0,z.x1-z.x0,z.y1-z.y0); c.strokeRect(z.x0,z.y0,z.x1-z.x0,z.y1-z.y0); }
  if (D.magnet&&D.snap&&(D.tool||D.draft||D.drag)&&D.mouse){ const sx=X(D.snap.t),sy=Y(D.snap.p); if(sx!=null&&sy!=null){ c.beginPath(); c.arc(sx,sy,6,0,7); c.lineWidth=2; c.strokeStyle='#ffeb3b'; c.stroke(); } }
  if (D.cursor==='dot'&&!D.tool&&D.mouse&&D.mouse.x<aw&&D.mouse.y<ah){ c.beginPath(); c.arc(D.mouse.x,D.mouse.y,4,0,7); c.fillStyle='#d1d4dc'; c.fill(); }
  c.restore();
  if (!D.hide) for (const d of D.list) if ((d.type==='hline'||d.type==='hray')&&d.pts[0]){ const y=Y(d.pts[0].p); if(y==null||y<0||y>ah) continue;
    c.fillStyle=d.color; c.fillRect(aw,y-9,pw,18); c.fillStyle='#fff'; c.font='11px ui-monospace,Consolas,monospace'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(fmtPrice(d.pts[0].p),aw+pw/2,y); }
}

/* ---------- 선택 / 이동 / 생성 ---------- */
const segDist=(x,y,[x1,y1,x2,y2])=>{const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((x-x1)*dx+(y-y1)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(x-(x1+t*dx),y-(y1+t*dy));};
let HT=1;   // 터치일 때 선택 판정 범위 배율
function hit(x,y){
  if (D.lock||D.hide) return null;
  if (D.sel&&D.sel._hd) for (let i=0;i<D.sel._hd.length;i++){ const h=D.sel._hd[i]; if(Math.hypot(h[0]-x,h[1]-y)<8*HT) return {d:D.sel,i}; }
  for (let k=D.list.length-1;k>=0;k--){ const d=D.list[k]; if(!d._segs) continue;
    for (const s of d._segs) if (segDist(x,y,s)<6*HT) return {d,i:-1};
    for (const r of d._rects) if (x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3]) return {d,i:-1};
    if (d._ell){ const [cx,cy,rx,ry]=d._ell; if (((x-cx)/rx)**2+((y-cy)/ry)**2<=1) return {d,i:-1}; } }
  return null;
}
const pos=e=>{const r=wrap.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
const inPlot=m=>D.area&&m.x>=0&&m.y>=0&&m.x<=D.area.w&&m.y<=D.area.h;
function fin(d){
  D.draft=null; D.ds=null; D.down=false;
  if (d.type==='measure') D.measure=d; else { pushHist(ser()); D.list.push(d); D.sel=d; save(); }
  if (!D.stay){ D.tool=null; } applyCursor(); refreshBar(); showStyle(); draw();
}
function toolDown(m){
  const T=D.tool,p=pt(m.x,m.y); if(!p) return;
  if (T==='eraser'){ const h=hit(m.x,m.y); if(h){ pushHist(ser()); D.list=D.list.filter(x=>x!==h.d); D.sel=null; save(); draw(); } return; }
  if (T==='zoom'){ D.zoomBox={x0:m.x,y0:m.y,x1:m.x,y1:m.y}; D.zdrag=true; return; }
  if (!D.draft){
    D.measure=null; const d={type:T,pts:[p],color:D.color,w:D.w};
    if (NEED[T]===1){
      if (T==='text'){ const s=prompt('텍스트를 입력하세요'); if(!s) return; d.text=s; }
      if (T==='emoji') d.emoji=D.emoji;
      if (T==='long'||T==='short'){ const up=T==='long',t1=pt(m.x+130,m.y).t; d.pts=[p,{t:t1,p:candle.coordinateToPrice(m.y+(up?-90:90))},{t:t1,p:candle.coordinateToPrice(m.y+(up?45:-45))}]; }
      return fin(d);
    }
    d.pts.push({...p}); D.draft=d; D.ds={x:m.x,y:m.y}; D.down=true; draw(); return;
  }
  const d=D.draft; d.pts[d.pts.length-1]=p; D.ds=null;
  if (T==='brush') return;
  if (d.pts.length>=NEED[T]) return fin(d);
  d.pts.push({...p}); draw();
}
function onDown(e){
  if (e.button!==0||e.target.closest('#dstyle,#zoomReset')) return;
  const m=pos(e); if(!inPlot(m)) return;
  if (D.tool){ e.stopPropagation(); e.preventDefault(); toolDown(m); return; }
  D.measure=null;
  const h=hit(m.x,m.y);
  if (h){ e.stopPropagation(); e.preventDefault(); D.sel=h.d; D.drag={d:h.d,i:h.i,start:pt(m.x,m.y),orig:JSON.parse(JSON.stringify(h.d.pts)),moved:false,snap:ser()}; showStyle(); draw(); }
  else if (D.sel){ D.sel=null; showStyle(); draw(); }
}
function onMove(e){
  const m=pos(e); D.mouse=m;
  if (D.zdrag){ D.zoomBox.x1=m.x; D.zoomBox.y1=m.y; draw(); return; }
  if (D.draft){ const p=pt(m.x,m.y),d=D.draft; if(p){ if(d.type==='brush'){ if(D.down) d.pts.push(p); } else d.pts[d.pts.length-1]=p; } draw(); return; }
  if (D.drag){ const dr=D.drag,p=pt(m.x,m.y); if(!p) return; dr.moved=true;
    if (dr.i<0){ const dt=p.t-dr.start.t,dp=p.p-dr.start.p; dr.d.pts.forEach((q,k)=>{q.t=dr.orig[k].t+dt;q.p=dr.orig[k].p+dp;}); }
    else { const q=dr.d.pts[dr.i]; q.t=p.t; q.p=p.p; if((dr.d.type==='long'||dr.d.type==='short')&&dr.i>0) dr.d.pts[1].t=dr.d.pts[2].t=p.t; }
    draw(); return; }
  if (!D.tool){ const h=inPlot(m)&&hit(m.x,m.y); wrap.classList.toggle('dmove',!!h); }
  if (D.tool&&D.magnet&&inPlot(m)){ pt(m.x,m.y); draw(); }
  if (D.cursor==='dot') draw();
}
function doZoom(){
  const z=D.zoomBox; D.zoomBox=null; D.zdrag=false; if(!D.stay) D.tool=null; refreshBar(); applyCursor();
  if (!z||Math.abs(z.x1-z.x0)<10||Math.abs(z.y1-z.y0)<10){ draw(); return; }
  const xa=Math.min(z.x0,z.x1),xb=Math.max(z.x0,z.x1),yt=Math.min(z.y0,z.y1),yb=Math.max(z.y0,z.y1);
  const l1=ts.coordinateToLogical(xa),l2=ts.coordinateToLogical(xb),pt_=candle.coordinateToPrice(yt),pb=candle.coordinateToPrice(yb);
  if (l1==null||l2==null||pt_==null||pb==null) return;
  const V=(pt_-pb)/0.72; D.zoomP={min:pb-.22*V,max:pt_+.06*V};
  ts.setVisibleLogicalRange({from:l1,to:l2}); $('zoomReset').style.display='block'; draw();
}
function resetZoom(){ D.zoomP=null; $('zoomReset').style.display='none'; ts.scrollToRealTime(); draw(); }
function onUp(){
  D.down=false;
  if (D.zdrag){ doZoom(); return; }
  if (D.drag){ if(D.drag.moved){ pushHist(D.drag.snap); save(); } D.drag=null; return; }
  const d=D.draft;
  if (d&&D.ds&&D.mouse&&Math.hypot(D.mouse.x-D.ds.x,D.mouse.y-D.ds.y)>6){
    if (d.type==='brush') fin(d);
    else if (d.pts.length===NEED[d.type]) fin(d);
    else if (d.pts.length===2&&NEED[d.type]>2&&NEED[d.type]<99){ D.ds=null; d.pts.push({...d.pts[1]}); draw(); }
  }
}

/* ---------- 터치 지원: 손가락으로 그리기 / 선택 / 이동 ----------
   · 도구를 고른 상태 또는 도면 위를 누르면 그리기가 손가락을 가져가고, 그 밖의 곳은 차트가 그대로 밀기/확대(핀치) 처리
   · 두 점 도구: 드래그로 그리거나, 점 두 곳을 차례로 탭   · 경로: 점을 탭으로 찍고 더블탭으로 끝냄   · 텍스트: 더블탭으로 수정 */
let TT=null, lastTap={t:0,x:0,y:0};
const tfake=(t,e)=>({button:0,target:e.target,clientX:t.clientX,clientY:t.clientY,stopPropagation(){},preventDefault(){}});
const tFind=(list,id)=>{ for(const t of list) if(t.identifier===id) return t; return null; };
function dblTouch(m){
  const d=D.draft;
  if (d&&d.type==='path'){ d.pts.splice(-2); d.pts.length>=2?fin(d):(cancelDraft(),draw()); return; }
  const h=!D.tool&&hit(m.x,m.y);
  if (h&&h.d.type==='text'){ const s=prompt('텍스트 수정',h.d.text); if(s){ pushHist(ser()); h.d.text=s; save(); draw(); } }
}
wrap.addEventListener('touchstart',e=>{
  if (e.target.closest('#dstyle,#zoomReset')) return;
  if (TT!==null){ e.stopPropagation(); e.preventDefault(); return; }      // 그리는 중 다른 손가락은 무시
  if (e.touches.length>1) return;                                          // 두 손가락 = 차트 핀치
  const t=e.touches[0], m=pos(t); if(!inPlot(m)) return;
  HT=2.4;
  try{
    const own=!!D.tool||!!hit(m.x,m.y);
    D.mouse=m;
    if (own){ e.stopPropagation(); e.preventDefault(); TT=t.identifier; }
    onDown(tfake(t,e));
    if (own){
      const now=Date.now();
      if (now-lastTap.t<350&&Math.hypot(m.x-lastTap.x,m.y-lastTap.y)<30){ lastTap.t=0; dblTouch(m); }
      else lastTap={t:now,x:m.x,y:m.y};
    }
  } finally { HT=1; }
},{capture:true,passive:false});
wrap.addEventListener('touchmove',e=>{
  if (TT===null) return;
  const t=tFind(e.touches,TT); if(!t) return;
  e.stopPropagation(); e.preventDefault();
  onMove(tfake(t,e));
},{capture:true,passive:false});
const tEnd=e=>{
  if (TT===null||tFind(e.touches,TT)) return;
  e.stopPropagation(); if(e.cancelable) e.preventDefault();
  TT=null; onUp(); D.mouse=null; draw();
};
wrap.addEventListener('touchend',tEnd,{capture:true,passive:false});
wrap.addEventListener('touchcancel',tEnd,{capture:true,passive:false});

/* ---------- 진입 신호 마커 (bybit.py 와 동일: RSI 과매도/과매수 기억 → RSI·RSI이평 크로스) ---------- */
(() => {
const CFG={rsiLen:15,maLen:15,os:30,ob:70,look:10,ticks:1};   // lever.env 의 RSI_LENGTH / RSI_MA_LENGTH / RSI_OVERSOLD / RSI_OVERBOUGHT / LOOKBACK_CANDLES / ENTRY_TICKS
const rv=(g,l)=>l===0?100:g===0?0:100-100/(1+g/l);
function rsiSeries(cl,len){
  const out=new Array(cl.length).fill(null); if(cl.length<len+1) return out;
  let g=0,l=0; for(let i=1;i<=len;i++){ const df=cl[i]-cl[i-1]; if(df>0) g+=df; else l-=df; }
  let ag=g/len,al=l/len; out[len]=rv(ag,al);
  for(let i=len+1;i<cl.length;i++){ const df=cl[i]-cl[i-1]; ag=(ag*(len-1)+(df>0?df:0))/len; al=(al*(len-1)+(df<0?-df:0))/len; out[i]=rv(ag,al); }
  return out;
}
function smaSeries(v,len){
  const out=new Array(v.length).fill(null);
  for(let i=len-1;i<v.length;i++){ let s=0,ok=true; for(let k=i-len+1;k<=i;k++){ if(v[k]==null){ok=false;break;} s+=v[k]; } if(ok) out[i]=s/len; }
  return out;
}
function signals(rows){
  const n=rows.length,rs=rsiSeries(rows.map(r=>r.close),CFG.rsiLen),ma=smaSeries(rs,CFG.maLen),out=[];
  const tick=Math.pow(10,-decimalsFor(rows[n-1].close));
  for (const d of [1,-1]){
    let armed=false;
    for (let i=0;i<n;i++){
      const r=rs[i],m=ma[i]; let sig=false;
      if (armed&&i>0&&r!=null&&m!=null&&rs[i-1]!=null&&ma[i-1]!=null){
        const pr=rs[i-1],pm=ma[i-1],x=d>0?(pr<=pm&&r>m):(pr>=pm&&r<m);
        if (x){ sig=true; armed=false; } }
      if (r!=null&&(d>0?r<=CFG.os:r>=CFG.ob)&&!armed) armed=true;
      if (sig){
        const key=d>0?'low':'high'; let best=-1;
        for (let k=Math.max(0,i-CFG.look);k<i;k++) if (best<0||d*(rows[k][key]-rows[best][key])<=0) best=k;
        if (best>=0){ const px=rows[best][key]-d*tick*CFG.ticks;
          if (d>0?px<rows[i].close:px>rows[i].close) out.push({time:rows[i].time,d}); }   // 지정가가 종가와 같거나 불리하면 바로 체결 → 신호 제외
      } } }
  return out.sort((a,b)=>a.time-b.time);
}
let key='';
function update(){
  const d=candle.data(),n=d.length; if(n<CFG.rsiLen+3) return;
  const on=$('chkSig').checked,k=[on,state.sym,state.tf,n,d[0].time,d[n-1].time].join('|'); if(k===key) return; key=k;
  if (!on){ candle.setMarkers([]); return; }
  candle.setMarkers(signals(d.slice(0,n-1)).map(s=>s.d>0   // 마감된 캔들만 (마지막 진행 중 캔들 제외)
    ?{time:s.time,position:'belowBar',color:'#16c79a',shape:'arrowUp',text:'롱'}
    :{time:s.time,position:'aboveBar',color:'#f0476a',shape:'arrowDown',text:'숏'}));
}
setInterval(update,1500);
})();

  }catch(e){
    console.error(e);
    setConn('데이터 로딩 실패 (네트워크/차단 확인)', false);
  }
}
function switchSymbol(sym){
  if (!sym || sym === state.sym) return;
  const sel = $('symSel');
  if (![...sel.options].some(o => o.value === sym)){ const o = document.createElement('option'); o.textContent = sym; sel.appendChild(o); }
  sel.value = sym; state.sym = sym; resetSymbolState(); start(); renderPanel();
}
$('symSel').onchange = e => { state.sym = e.target.value; resetSymbolState(); start(); renderPanel(); };
$('thrSel').onchange = e => { state.thr = +e.target.value; state.whales = state.whales.filter(w=>w.usd>=state.thr); renderWhales(); };
$('liqSel').onchange = e => { state.liqThr = +e.target.value; state.liqs = []; renderLiqs(); };
$('tfBar').addEventListener('click', e => {
  const b = e.target.closest('button[data-tf]'); if(!b) return;
  document.querySelectorAll('#tfBar button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); state.tf = b.dataset.tf; state.hover = null; start();
});
$('chkVol').onchange = e => volume.applyOptions({visible:e.target.checked});
['chkLiq','chkHL'].forEach(id => $(id).onchange = drawBubbles);
(function(){      // 차트 오른쪽 옵션 패널 열기/닫기 (상태 기억)
  const side=$('optSide'), btn=$('optToggle');
  const set=on=>{ side.classList.toggle('open',on); btn.textContent=on?'»':'«'; try{localStorage.setItem('optOpen',on?'1':'0');}catch{} };
  btn.onclick=()=>set(!side.classList.contains('open'));
  let v='0'; try{ v=localStorage.getItem('optOpen')||'0'; }catch{}
  set(v==='1');
})();
(function(){      // 전체화면 모드 (종료는 버튼 또는 Esc / 폰에서는 상단 시세·하단 요약을 접어 차트와 포지션을 크게)
  const btn=$('fsBtn'), el=document.documentElement;
  const rq=el.requestFullscreen||el.webkitRequestFullscreen;
  const ex=document.exitFullscreen||document.webkitExitFullscreen;
  const svg=d=>`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
  const ENTER=svg('M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4'), EXIT=svg('M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4');
  const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  let pseudo=false;                                   // iPhone Safari 등 Fullscreen API가 없는 기기용 대체 전체화면
  const upd=()=>{ const on=isFs()||pseudo; btn.innerHTML=on?EXIT:ENTER; btn.title=on?'전체화면 종료':'전체화면'; };
  const setPseudo=on=>{ pseudo=on; document.body.classList.toggle('pfs',on); upd(); };
  btn.onclick=()=>{
    if (isFs()||pseudo){ try{ if(isFs()) ex.call(document); }catch{} setPseudo(false); return; }
    setPseudo(true);
    if (rq){ try{ const p=rq.call(el); if(p&&p.catch) p.catch(()=>{}); }catch{} }
  };
  const onfs=()=>{ if(!isFs()&&pseudo) setPseudo(false); else upd(); };
  document.addEventListener('fullscreenchange',onfs); document.addEventListener('webkitfullscreenchange',onfs);
  upd();
})();

setInterval(()=>{ $('clock').textContent = new Date().toLocaleTimeString('ko-KR',{hour12:false}); renderWhales(); renderLiqs(); }, 1000);
setInterval(pollSlow, 30000);
setInterval(pollSnap, 2500);

resize(); renderFoot(); renderPanel(); start(); pollSnap();
})();
</script>
